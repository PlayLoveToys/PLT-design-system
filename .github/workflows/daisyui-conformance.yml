name: daisyUI conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"self-hosted"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Chromium for @playlovetoys/web-components browser tests.
      # Self-hosted host is Ubuntu 26.04; Playwright 1.56 has no native 26.04
      # profile — override to 24.04. OS libs are preinstalled on the runner
      # (no --with-deps: github-runner has no sudo).
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: npx playwright install chromium
      # The runner lacks some Chromium libraries (libnss3, libatk, libasound...)
      # and has no sudo. When they are missing, unpack the packages into the
      # job's temp dir without installing them and expose them through
      # LD_LIBRARY_PATH. A no-op once the host has them.
      - name: Chromium system libraries (no sudo)
        run: |
          if ldconfig -p | grep -q 'libnss3\.so' && ldconfig -p | grep -q 'libasound\.so\.2'; then
            echo "Chromium libraries present on the host."
            exit 0
          fi
          libs="$RUNNER_TEMP/chromium-libs"
          mkdir -p "$libs/debs" "$libs/root"
          cd "$libs/debs"
          apt-get download libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libatspi2.0-0t64 libxdamage1 libasound2t64
          for deb in *.deb; do dpkg -x "$deb" "$libs/root"; done
          echo "LD_LIBRARY_PATH=$libs/root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: npm run check

