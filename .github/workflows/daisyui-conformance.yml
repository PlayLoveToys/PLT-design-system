name: daisyUI conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"self-hosted"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Chromium for @playlovetoys/web-components browser tests.
      # Self-hosted host is Ubuntu 26.04; Playwright 1.56 has no native 26.04
      # profile — override to 24.04. github-runner has no sudo, so there is no
      # --with-deps: the system libraries Chromium needs (libnss3, libatk, ...)
      # are fetched as .deb files without root when the host lacks them.
      - name: Chromium system libraries (no sudo)
        run: bash scripts/ci-chromium-libs.sh
      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: npx playwright install chromium
      - run: npm run check

